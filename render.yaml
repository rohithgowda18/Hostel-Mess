services:
  # Spring Boot Backend Web Service using Docker
  - type: web
    name: hostel-mess-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        value: https://hostel-hub.rohith.app
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DISABLE_TIME_RESTRICTIONS
        value: false
