services:
  # Spring Boot Backend Web Service
  - type: web
    name: hostel-mess-backend
    env: image
    image:
      url: maven:3.9-eclipse-temurin-17
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: java -jar backend/target/mess-breakfast-1.0.0.jar
    envVars:
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        value: https://hostel-hub.rohith.app
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
