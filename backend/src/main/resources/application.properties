# ==========================================
# Application Configuration
# ==========================================
spring.application.name=mess-breakfast
server.port=${PORT:8080}
# Auto-load backend/.env for local `mvn spring-boot:run` (ignored if absent;
# real environment variables always take precedence, e.g. on Render).
# The [.properties] suffix forces the extensionless .env file to be read as properties.
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Database Configuration
# ==========================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/hostel_mess}}
spring.data.mongodb.auto-index-creation=true

# ==========================================
# Security & JWT Configurations
# ==========================================
jwt.secret=${JWT_SECRET:dev-secret-key-replace-in-production-environment-variable-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Meal Reporting Window Control
# ==========================================
# When true, time-window restrictions for meal reporting are bypassed (DEV/testing only).
# Leave unset/false in production so updates are limited to the configured meal windows.
app.disable-time-restrictions=${DISABLE_TIME_RESTRICTIONS:false}

# ==========================================
# Multipart Upload Settings
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Logging Configurations
# ==========================================
logging.level.root=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb=WARN
logging.level.com.hostel.mess=DEBUG
