# ==========================================
# Application Configuration
# ==========================================
spring.application.name=mess-breakfast
server.port=${PORT:8080}

# ==========================================
# Database Configuration
# ==========================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/hostel_mess}}
spring.data.mongodb.auto-index-creation=true

# ==========================================
# Security & JWT Configurations
# ==========================================
jwt.secret=${JWT_SECRET:your-secret-key-for-development-with-32-or-more-characters-minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Multipart Upload Settings
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Logging Configurations
# ==========================================
logging.level.root=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb=WARN
logging.level.com.hostel.mess=DEBUG
